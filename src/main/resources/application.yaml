spring:
  application:
    name: todoapi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/todoapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:todouser}
    password: ${SPRING_DATASOURCE_PASSWORD:pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    user:
      # Standardvärden för lokal utveckling. I produktion måste APP_USER och
      # APP_PASSWORD sättas (compose.production.yml vägrar starta annars).
      name: ${APP_USER:dev}
      password: ${APP_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
