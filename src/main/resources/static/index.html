<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>To-Do</title>
</head>
<body>
    <div class="container">

        <!-- Hero -->
        <header>
            <h1>To-Do<span id="dot">.</span></h1>
        </header>

        <!-- To-do list -->
        <section>
            <form id="todo-form">
                <label class="sr-only" for="todo-input">Add To-Do</label>
                <input id="todo-input" name="todo" type="text" placeholder="What needs doing?" autocomplete="off" required>
                <button type="submit">Add Task</button>
            </form>

            <section class="tasks-panel" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading" class="panel-label">Tasks</h2>
                <div class="toolbar">
                    <p id="todo-counter">0 tasks</p>
                    <div class="filters">
                        <button type="button" data-filter="all" class="active">All</button>
                        <button type="button" data-filter="active">Active</button>
                        <button type="button" data-filter="completed">Completed</button>
                    </div>
                </div>

                <ul id="todo-list"></ul>
            </section>
        </section>
    </div>
</body>
</html>
