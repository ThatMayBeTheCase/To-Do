name: Deploy application

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            thatmaybethecase/to-do:latest
            thatmaybethecase/to-do:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: casemint

      - name: Copy production Compose file
        run: |
          tailscale ssh case@casemint \
          'cat > /home/case/srv/to-do/compose.production.yml' \
          < compose.production.yml

      - name: Deploy application
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          tailscale ssh case@casemint "
          set -e
          cd /home/case/srv/to-do
          export IMAGE_TAG='$IMAGE_TAG'
          docker compose -f compose.production.yml pull
          docker compose -f compose.production.yml up -d --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:18080/ > /dev/null
          "
